<!DOCTYPE html>
<html>
<head>
  <!--

    For more details:

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="SISTEMA DE DESBLOQUEIG RECEPTACLE DEA">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="DEA Codi L-4">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>DEA Codi L-4</title>
  <link rel="manifest" href="manifest.json">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  html:not(.dea-approved) #flutter_host{visibility:hidden}
  #dea-status{position:fixed;inset:0;z-index:900;display:grid;place-content:center;padding:24px;background:#f5f5f5;color:#161616;font:16px system-ui;text-align:center}
  #dea-status[hidden]{display:none}#dea-retry{min-height:44px;margin:12px}
  </style>
</head>
<body>
  <a class="tmb-home" href="https://roberfernandez.github.io/tmb-agent/" aria-label="Tornar a TMB Agent" title="Tornar a TMB Agent"><img src="https://roberfernandez.github.io/tmb-agent/assets/icons/tmb-agent-192.png" alt=""></a>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden}
    #flutter_host{position:absolute;inset:0;overflow:hidden}
    .tmb-home{position:fixed;z-index:1100;top:max(10px,env(safe-area-inset-top,0px));left:max(14px,env(safe-area-inset-left,0px));width:38px;height:38px;display:grid;place-items:center;border-radius:10px}
    .tmb-home img{width:32px;height:32px;border-radius:8px;object-fit:cover}
  </style>
  <div id="flutter_host"></div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <div id="dea-status" role="status"><p id="dea-message">Comprovant el teu accés…</p><button id="dea-retry" hidden>Torna-ho a provar</button></div>
  <script type="module" src="dea-access.js"></script>
</body>
</html>
